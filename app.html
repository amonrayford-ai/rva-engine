<style>
/* RVA Engine — layout & visual design (lane A).
   One-screen phone app in a 480px column with a 5-screen dock. Single warm dark look by design.
   Everything sizes off the tokens below: type scale, 4px spacing grid, icon scale, radii. */
:root{
  color-scheme:dark;
  /* color */
  --black:#0B0A0E;--choc:#1A0F0A;--choc-2:#261710;--choc-3:#3A2418;--choc-4:#4A3020;
  --bronze:#CD7F32;--bronze-lt:#E8A968;--bronze-dk:#8B5A2B;
  --silver:#C0C0C0;--burgundy:#5E1224;--burgundy-2:#3A1420;
  --text:#F5EFE6;--dim:#C4B5A0;--dim-2:#A39380;
  --line:#8A7560;          /* control boundaries: 4.29:1 on --choc, 3.32:1 on --choc-3 (WCAG 1.4.11) */
  --red:#E74C3C;--red-dk:#B83227;--red-txt:#F5A9A0;--green:#2ECC71;--green-dk:#1E8449;
  --ink:#150A05;--gold-sh:#3A1F05;--on-light:#2A1A12;
  /* type scale (floor 11px) */
  --fs-2xs:11px;--fs-xs:12px;--fs-s:13px;--fs-m:15px;--fs-l:18px;--fs-xl:24px;--fs-display:52px;
  /* spacing, 4px grid */
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;
  --gut-l:max(16px,env(safe-area-inset-left,0px));--gut-r:max(16px,env(safe-area-inset-right,0px));
  /* 3D icon scale */
  --ic-s:18px;--ic-m:24px;--ic-l:28px;--ic-xl:40px;
  /* shape + depth */
  --r-s:8px;--r-m:12px;--r:14px;--r-l:18px;--r-pill:22px;
  --tap:44px;
  --sh-sm:0 3px 0 var(--ink),0 6px 12px rgba(0,0,0,0.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--black);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,label.btn{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;touch-action:manipulation}
/* 16px stops iOS Safari from zooming the page on focus (MOB-6); never use maximum-scale for this */
input,select,textarea{font-family:inherit;font-size:16px}
:focus-visible{outline:2px solid var(--bronze-lt);outline-offset:2px}
.vh,.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
#app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;background:var(--black);position:relative;overflow:hidden}

/* ---------- CHROME: top bar + dock ---------- */
.topbar{padding:max(10px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,var(--choc-2),var(--black));border-bottom:1px solid var(--bronze-dk);display:flex;align-items:center;justify-content:space-between;position:relative;z-index:20;flex-shrink:0}
.brand{font-size:var(--fs-xs);font-weight:900;letter-spacing:3px;text-transform:uppercase;color:var(--bronze-lt)}
.brand span{color:var(--silver)}
.icon-btn{width:var(--tap);height:var(--tap);border-radius:var(--r-m);display:flex;align-items:center;justify-content:center;background:var(--choc-3);border:1px solid var(--bronze-dk);font-size:17px;box-shadow:var(--sh-sm);transition:transform 0.06s}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.screens{flex:1;position:relative;overflow:hidden;min-height:0}
.screen{position:absolute;top:0;right:0;bottom:0;left:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;opacity:0;pointer-events:none;visibility:hidden;transition:opacity 0.25s,visibility 0s 0.25s;-webkit-overflow-scrolling:touch}
.screen.active{opacity:1;pointer-events:auto;visibility:visible;transition:opacity 0.25s}
.dock{display:flex;justify-content:space-around;flex-shrink:0;padding:var(--sp-2) max(6px,env(safe-area-inset-right,0px)) calc(var(--sp-2) + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,var(--choc-2),var(--black));border-top:1px solid var(--bronze-dk);box-shadow:0 -8px 20px rgba(0,0,0,0.6);position:relative;z-index:20}
.dock-btn{flex:1 1 0;min-width:0;margin:0 3px;padding:7px 2px 6px;background:linear-gradient(180deg,var(--choc-3),var(--choc));border:1.5px solid var(--bronze-dk);border-radius:var(--r-m);color:var(--dim);font-size:var(--fs-2xs);font-weight:800;text-transform:uppercase;letter-spacing:0.3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;box-shadow:var(--sh-sm);transition:transform 0.06s,box-shadow 0.06s,color 0.2s,background 0.2s}
.dock-btn>span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock-btn .icon{font-size:18px;line-height:1;height:var(--ic-l);display:flex;align-items:center}
.dock-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.dock-btn.active{color:var(--black);background:linear-gradient(180deg,var(--bronze-lt),var(--bronze));border-color:var(--bronze-lt)}

/* ---------- COMPONENTS ---------- */
.card{background:linear-gradient(160deg,var(--choc-3),var(--choc-2));border:1.5px solid var(--bronze-dk);border-radius:var(--r);padding:var(--sp-3);margin-bottom:var(--sp-3);box-shadow:var(--sh-sm)}
.card.accent{border-color:var(--burgundy);background:linear-gradient(160deg,var(--burgundy-2),var(--choc-2))}
.card.gold{border-color:var(--bronze-lt);background:linear-gradient(160deg,#4A2E15,var(--choc-3));box-shadow:0 5px 0 var(--gold-sh),0 10px 20px rgba(205,127,50,0.3)}
.card-label{font-size:var(--fs-2xs);color:var(--bronze-lt);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:6px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.frac{border-bottom:2px solid var(--bronze);padding-bottom:var(--sp-1);margin-bottom:6px;font-weight:800;font-size:var(--fs-m);letter-spacing:0.2px;line-height:1.25;text-wrap:balance}
.den{font-size:var(--fs-xs);color:var(--dim);line-height:1.5}
.btn{display:block;width:100%;min-height:var(--tap);padding:11px;margin-top:var(--sp-2);background:linear-gradient(180deg,var(--bronze-lt),var(--bronze));color:var(--black);border:1.5px solid var(--bronze-dk);border-radius:11px;font-weight:900;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:1px;box-shadow:0 3px 0 var(--bronze-dk),0 5px 10px rgba(0,0,0,0.4);transition:transform 0.06s,box-shadow 0.06s;text-align:center}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--bronze-dk)}
.btn.ghost{background:transparent;color:var(--bronze-lt);border-color:var(--bronze)}
.btn.ghost:active{background:rgba(205,127,50,0.15)}
.btn.on{background:linear-gradient(180deg,#5CE08A,var(--green));border-color:var(--green-dk);color:var(--black)}
.btn.red{background:linear-gradient(180deg,#C8412F,var(--red-dk));border-color:#7E2219;color:#fff}
.btn.sm{padding:8px 12px;font-size:var(--fs-2xs);width:auto;display:inline-flex;align-items:center;justify-content:center;margin-top:0}
.btn:disabled{opacity:0.45;cursor:default}
.pill{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;background:rgba(205,127,50,0.15);border:1px solid var(--bronze);border-radius:11px;font-size:var(--fs-2xs);color:var(--bronze-lt);text-transform:uppercase;letter-spacing:0.3px;font-weight:800;line-height:1.3}
.pill.dim{background:var(--choc);border-color:var(--choc-4);color:var(--dim)}
.pill.green{background:rgba(46,204,113,0.15);border-color:var(--green);color:var(--green)}
.pill.red{background:rgba(231,76,60,0.15);border-color:var(--red);color:var(--red-txt)}
.pill.gold{background:var(--bronze);border-color:var(--bronze-lt);color:var(--black)}
.pill.sample{background:transparent;border:1px dashed var(--dim-2);color:var(--dim-2)}
.panel{padding:var(--sp-3) var(--gut-r) var(--sp-4) var(--gut-l)}
.row{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);background:var(--bronze);color:var(--black);padding:10px 18px;border-radius:20px;font-size:var(--fs-xs);font-weight:900;text-transform:uppercase;letter-spacing:1px;opacity:0;transition:all 0.25s;z-index:200;box-shadow:0 4px 0 var(--bronze-dk),0 8px 16px rgba(0,0,0,0.5);pointer-events:none;max-width:86%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.field{width:100%;background:var(--choc);border:1.5px solid var(--line);border-radius:10px;color:var(--text);padding:10px;min-height:var(--tap);margin-top:6px;line-height:1.35}
.field::placeholder{color:var(--dim-2);opacity:1}
textarea.field{resize:vertical;min-height:72px}
.field:focus{border-color:var(--bronze-lt);outline:none;box-shadow:0 0 0 2px rgba(232,169,104,0.45)}
.field:focus-visible{outline:none}
.counter{font-size:var(--fs-2xs);color:var(--dim-2);text-align:right;margin-top:3px;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--dim);font-size:var(--fs-xs);padding:10px 0;line-height:1.5}
.list-item{display:flex;align-items:center;gap:10px;padding:var(--sp-2) 0;border-bottom:1px solid var(--choc-3)}
.list-item:last-child{border-bottom:0}
.list-item .em{font-size:22px;width:var(--ic-l);text-align:center;flex-shrink:0}
.list-item .t{font-size:var(--fs-s);font-weight:800;line-height:1.25}
.list-item .m{font-size:var(--fs-2xs);color:var(--dim)}
.x-btn{width:var(--tap);height:var(--tap);border-radius:10px;border:1px solid var(--choc-4);background:var(--choc);color:var(--dim);font-size:14px;flex-shrink:0}
/* utility classes for template copy (replace inline style= in templates) */
.t-2xs{font-size:var(--fs-2xs)}.t-xs{font-size:var(--fs-xs)}.t-s{font-size:var(--fs-s)}.t-m{font-size:var(--fs-m)}
.t-body{color:var(--text);font-size:var(--fs-s);line-height:1.4}
.t-center{text-align:center}.t-bronze{color:var(--bronze-lt)}.t-warn{color:var(--red-txt)}.t-dim2{color:var(--dim-2)}
.mt-1{margin-top:var(--sp-1)}.mt-2{margin-top:var(--sp-2)}.mt-3{margin-top:var(--sp-3)}.mb-0{margin-bottom:0}.mb-2{margin-bottom:var(--sp-2)}.mb-3{margin-bottom:var(--sp-3)}
.lead{margin-bottom:var(--sp-3)}
.row-ic{font-size:26px;width:var(--ic-l);text-align:center;flex-shrink:0;line-height:1}
.row-ic img.i3d{width:var(--ic-l);height:var(--ic-l);vertical-align:middle}

/* ---------- TILE GRID (filters / feed sections / life sections / hoods) ----------
   Every option visible at once: a wrapping grid of icon-over-label tiles, no horizontal scroll.
   Active tile = filled bronze + raised + heavier label + a pointer notch (shape, not only color). */
.tiles{--cols:4;--tgap:6px;display:flex;flex-wrap:wrap;justify-content:center;gap:var(--tgap);row-gap:calc(var(--tgap) + 3px);padding:var(--sp-2) var(--gut-r) 10px var(--gut-l);background:var(--black);border-bottom:1px solid var(--choc-3)}
.tile{position:relative;flex:0 0 calc((100% - (var(--cols) - 1) * var(--tgap)) / var(--cols));max-width:calc((100% - (var(--cols) - 1) * var(--tgap)) / var(--cols));min-width:0;min-height:54px;padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:linear-gradient(180deg,var(--choc-3),var(--choc-2));border:1.5px solid var(--choc-4);border-radius:var(--r-m);color:var(--dim);font-size:var(--fs-2xs);font-weight:700;letter-spacing:-0.2px;line-height:1.1;text-align:center;box-shadow:0 2px 0 var(--ink);transition:background 0.15s,border-color 0.15s,transform 0.1s,box-shadow 0.15s}
.tile-ic{width:var(--ic-m);height:var(--ic-m);display:flex;align-items:center;justify-content:center;font-size:19px;line-height:1;flex-shrink:0}
.tile-lb{display:block;max-width:100%;padding:0 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-n{position:absolute;top:3px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--choc);border:1px solid var(--choc-4);color:var(--dim);font-size:var(--fs-2xs);font-weight:800;line-height:15px;font-variant-numeric:tabular-nums}
.tile:active{transform:translateY(1px);box-shadow:0 1px 0 var(--ink)}
.tile.active{background:linear-gradient(180deg,var(--bronze-lt),var(--bronze));border-color:var(--bronze-lt);color:var(--black);font-weight:800;box-shadow:0 3px 0 var(--bronze-dk),0 6px 14px rgba(205,127,50,0.3);transform:translateY(-1px)}
.tile.active::after{content:'';position:absolute;left:50%;bottom:-7px;margin-left:-5px;border:5px solid transparent;border-top-width:6px;border-top-color:var(--bronze);border-bottom:0;pointer-events:none}
.tile.active .tile-n{background:var(--black);border-color:var(--black);color:var(--bronze-lt)}
.tile.active .tile-ic{transform:scale(1.1)}
#filterRow{--cols:5;--tgap:4px;padding:0;background:none;border:0;margin-bottom:12px;flex-shrink:0}
#filterRow .tile{min-height:50px}
#lifeTabs{--cols:3}
#hoodChips{--cols:4;--tgap:5px;padding:0;background:none;border:0;margin-top:var(--sp-3)}
@media (min-width:420px){#feedTabs,#lifeTabs{--cols:6}}
@media (max-width:340px){#filterRow .tile,#hoodChips .tile{letter-spacing:-0.45px}}
@media (hover:hover) and (pointer:fine){
  .tile:hover{border-color:var(--bronze-dk);color:var(--text)}
  .tile.active:hover{color:var(--black);border-color:var(--bronze-lt)}
}
/* compact "current section" bar that slides in once the tile grid scrolls out of view */
.tabs-mini{position:-webkit-sticky;position:sticky;top:0;height:0;z-index:12}
.tabs-mini-bar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:var(--sp-2);width:100%;min-height:48px;padding:2px var(--gut-r) 2px var(--gut-l);background:linear-gradient(180deg,var(--choc-2),var(--black));border-bottom:1px solid var(--bronze-dk);box-shadow:0 6px 14px rgba(0,0,0,0.5);color:var(--text);font-size:var(--fs-s);font-weight:800;text-align:left;transform:translateY(-110%);opacity:0;visibility:hidden;transition:transform 0.2s,opacity 0.2s,visibility 0s 0.2s}
.tabs-mini.show .tabs-mini-bar{transform:none;opacity:1;visibility:visible;transition:transform 0.2s,opacity 0.2s}
.tabs-mini-bar .tile-ic{width:var(--ic-l);height:var(--ic-l)}
.tabs-mini-bar .mini-lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs-mini-bar .mini-more{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:var(--r-pill);border:1.5px solid var(--bronze);color:var(--bronze-lt);font-size:var(--fs-2xs);text-transform:uppercase;letter-spacing:0.6px}
.tabs-mini-bar .mini-more::before{content:'';width:7px;height:7px;border-left:2px solid currentColor;border-top:2px solid currentColor;transform:translateY(2px) rotate(45deg)}

/* ---------- HOME ---------- */
#home{background:radial-gradient(circle at 50% 0%, #2A1A12 0%, var(--black) 60%)}
.home-wrap{padding:var(--sp-5) var(--gut-r) var(--sp-5) var(--gut-l);position:relative;min-height:100%}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes drift{0%{transform:translateX(-80px)}100%{transform:translateX(560px)}}
.home-head{text-align:center;margin-bottom:var(--sp-5);position:relative;z-index:2}
/* Clock sits on a chocolate glass plaque so white digits pass on the bright day sky:
   white on rgba(26,15,10,.72) over the lightest sky stop #d9f2ff = 8.19:1, over sampled #99D5F7 = 9.61:1 (was 1.59:1 bare). */
.clock{display:table;margin:0 auto;padding:6px 18px 8px;border-radius:var(--r-l);background:rgba(26,15,10,0.72);border:1.5px solid rgba(232,169,104,0.45);box-shadow:0 4px 0 rgba(21,10,5,0.35);font-size:var(--fs-display);font-weight:300;letter-spacing:-2px;color:#fff;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 rgba(42,26,18,0.5)}
.clock .ampm{font-size:var(--fs-s);font-weight:800;letter-spacing:1px;margin-left:6px;vertical-align:0.9em;text-transform:uppercase;color:var(--bronze-lt)}
.date{display:inline-block;margin-top:var(--sp-2);padding:4px 10px;border-radius:var(--r-m);background:rgba(11,10,14,0.78);color:var(--text);font-size:var(--fs-2xs);text-transform:uppercase;letter-spacing:1.6px;font-weight:700}
@media (max-width:374px){.date{letter-spacing:0.5px;padding:4px 8px;text-wrap:balance}}
.home-wrap .card{position:relative;z-index:2}
.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-2);margin-top:var(--sp-2)}
.stat{background:var(--choc);border:1px solid var(--choc-4);border-radius:10px;padding:var(--sp-2) 4px;text-align:center}
.stat .v{font-size:var(--fs-m);font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.stat .k{font-size:var(--fs-2xs);color:var(--dim);text-transform:uppercase;letter-spacing:0.6px;margin-top:2px;font-weight:700}
.sky3d{position:absolute;left:0;right:0;top:0;height:272px;pointer-events:none;z-index:0}
.sky3d canvas{display:block;width:100%;height:100%}
#homeContent{position:relative;z-index:1}

/* ---------- SWIPE ---------- */
/* Column flex: head, filters and actions never shrink; the deck takes what is left (MOB-1). */
#swipe{padding:var(--sp-3) var(--gut-r) var(--sp-3) var(--gut-l);display:flex;flex-direction:column;background:radial-gradient(circle at 50% 100%, #2A1A12 0%, var(--black) 70%)}
.swipe-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--sp-2);gap:var(--sp-2);flex-shrink:0}
.swipe-title{font-size:var(--fs-m);font-weight:900;text-transform:uppercase;letter-spacing:1.5px;color:var(--bronze-lt)}
.swipe-count{font-size:var(--fs-2xs);color:var(--dim);text-transform:uppercase;letter-spacing:0.8px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.deck{flex:1 1 auto;position:relative;min-height:200px;margin-bottom:var(--sp-3)}
.deck>*{top:0;right:0;bottom:0;left:0}
/* pan-y: a vertical drag on the card scrolls the screen when it has to (MOB-7); horizontal drags still swipe */
.ev-card{position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(170deg,var(--choc-3),var(--choc-2));border:2px solid var(--bronze);border-radius:var(--r-l);overflow:hidden;box-shadow:0 8px 0 var(--ink),0 14px 28px rgba(0,0,0,0.7);display:flex;flex-direction:column;cursor:grab;touch-action:pan-y;will-change:transform;user-select:none;-webkit-user-select:none}
.ev-card.gold{border-color:var(--bronze-lt);box-shadow:0 8px 0 var(--gold-sh),0 14px 28px rgba(205,127,50,0.5);background:linear-gradient(170deg,#4A2E15,var(--choc-2))}
.ev-art{flex:1 1 auto;display:flex;align-items:center;justify-content:center;font-size:90px;background:radial-gradient(circle at 50% 50%, var(--choc-4), var(--choc-2) 70%);min-height:96px;position:relative;overflow:hidden}
.ev-art .rank{position:absolute;top:var(--sp-3);left:var(--sp-3)}
.ev-body{padding:var(--sp-3) 14px 14px;position:relative;z-index:2;flex-shrink:0}
.ev-name{font-size:var(--fs-l);font-weight:900;margin-bottom:3px;line-height:1.15}
.ev-meta{font-size:var(--fs-xs);color:var(--dim);margin-bottom:var(--sp-2)}
.ev-tags{display:flex;gap:5px;flex-wrap:wrap}
.access-warn{margin-top:var(--sp-2);padding:6px 8px;background:rgba(231,76,60,0.12);border:1px solid var(--red);border-radius:var(--r-s);font-size:var(--fs-2xs);color:var(--red-txt);font-weight:700}
.badge{position:absolute;top:16px;padding:7px 14px;border-radius:var(--r-s);font-weight:900;font-size:14px;letter-spacing:2px;opacity:0;transition:opacity 0.1s;pointer-events:none;z-index:5;text-transform:uppercase}
.badge.yes{right:16px;background:var(--green-dk);color:#fff;border:2px solid #fff;transform:rotate(12deg)}
.badge.no{left:16px;background:var(--red-dk);color:#fff;border:2px solid #fff;transform:rotate(-12deg)}
.actions{display:flex;justify-content:center;gap:var(--sp-4);align-items:center;flex-shrink:0;padding-bottom:4px}
.act{width:60px;height:60px;border-radius:50%;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 rgba(0,0,0,0.4),0 8px 16px rgba(0,0,0,0.5);transition:transform 0.06s,box-shadow 0.06s}
.act:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,0.4)}
.act.no{background:linear-gradient(180deg,#C8412F,var(--red-dk));color:#fff;border:2px solid var(--red)}
.act.maybe{width:52px;height:52px;font-size:20px;background:linear-gradient(180deg,var(--bronze-lt),var(--bronze));color:var(--black);border:2px solid var(--bronze-dk)}
/* white heart: 3.06:1 on #2EA85A, 4.72:1 on #1E8449 (was 2.36:1 on #3FBF6E) */
.act.yes{background:linear-gradient(180deg,#2EA85A,var(--green-dk));color:#fff;border:2px solid var(--green)}
.act:disabled{opacity:0.4}
.ev-card.gold .ev-art{background:radial-gradient(circle at 50% 50%,#5C3A1A,#261710 70%);font-size:60px}
.ev-card.gold .ev-name{color:var(--bronze-lt);font-size:var(--fs-m)}
.ev-meta.sub{margin-top:6px;color:var(--bronze-lt);font-weight:700}
.deck-empty{position:absolute;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--dim);text-align:center;padding:var(--sp-5)}
.deck-empty .big{font-size:52px;margin-bottom:var(--sp-3)}
.deck-empty .h{font-size:var(--fs-s);text-transform:uppercase;letter-spacing:1.5px;font-weight:900;color:var(--bronze-lt)}

/* ---------- MAP ---------- */
#map{padding:var(--sp-3) var(--gut-r) var(--sp-4) var(--gut-l);background:radial-gradient(circle at 50% 40%, #1A1008 0%, var(--black) 70%)}
.map-head{text-align:center;margin-bottom:var(--sp-2)}
.map-title{font-size:var(--fs-m);font-weight:900;text-transform:uppercase;letter-spacing:2px;color:var(--bronze-lt)}
.map-sub{font-size:var(--fs-2xs);color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-top:2px;font-weight:700}
/* 2D fallback board (no WebGL) */
.board-wrap{position:relative;padding:14px 0}
.board-deco{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:1;overflow:hidden}
.board-deco .sun{position:absolute;top:0;right:8px;font-size:32px;filter:drop-shadow(0 0 12px rgba(232,169,104,0.8));animation:float 5s ease-in-out infinite}
.board-deco .cl{position:absolute;font-size:26px;opacity:0.3;animation:drift 45s linear infinite}
.board-deco .cl.c1{top:10px;left:0}
.board-deco .cl.c2{top:60px;right:20px;animation-duration:55s;font-size:20px}
.board-deco .grass{position:absolute;bottom:0;left:0;font-size:20px;opacity:0.4}
.board-deco .grass.r{left:auto;right:0}
.board{perspective:900px;perspective-origin:50% 35%;position:relative;z-index:2}
.grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,76px);grid-template-areas:"nw n ne" "w c e" "sw s se";gap:5px;transform:rotateX(42deg) rotateZ(-8deg) scale(0.94);transform-style:preserve-3d;transition:transform 0.5s cubic-bezier(0.25,0.46,0.45,0.94)}
.sector{background:linear-gradient(160deg,var(--choc-4),var(--choc-2));border:1.5px solid var(--bronze);border-radius:var(--r-s);padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 5px 0 var(--ink),0 6px 12px rgba(0,0,0,0.6);transition:transform 0.3s,filter 0.3s,opacity 0.3s,box-shadow 0.3s;position:relative;z-index:1;overflow:hidden;color:inherit}
.sector .sicon{font-size:16px;line-height:1;margin-bottom:2px}
.sector .sname{font-size:var(--fs-2xs);font-weight:900;text-transform:uppercase;letter-spacing:0;color:var(--bronze-lt);line-height:1.05}
.sector .scount{font-size:var(--fs-2xs);color:var(--dim);margin-top:1px;font-variant-numeric:tabular-nums}
.sector.hub{background:linear-gradient(160deg,var(--burgundy),#3A0A15);border-color:var(--bronze-lt)}
.sector.hub .sname{color:var(--text)}
.sector .chars{position:absolute;bottom:2px;font-size:var(--fs-2xs);opacity:0.8;animation:float 3s ease-in-out infinite}
.board.focus .sector:not(.focused){filter:blur(2.5px) brightness(0.35);opacity:0.5}
.board.focus .grid{transform:rotateX(30deg) rotateZ(-4deg) scale(1.02)}
.sector.focused{transform:translateZ(50px) scale(1.3);box-shadow:0 12px 0 var(--ink),0 16px 32px rgba(205,127,50,0.6);z-index:100;filter:none!important;opacity:1!important}
.map-detail{margin-top:var(--sp-3);background:linear-gradient(160deg,var(--choc-3),var(--choc-2));border:1.5px solid var(--bronze);border-radius:var(--r-m);padding:var(--sp-3);box-shadow:var(--sh-sm);position:relative;z-index:3}
.map-detail h3{margin:0 0 6px;font-size:var(--fs-m);color:var(--bronze-lt);text-transform:uppercase;letter-spacing:1px}
.mini{background:linear-gradient(160deg,#4A2E15,var(--choc));border:1.5px solid var(--bronze-lt);border-radius:10px;padding:10px;display:flex;align-items:center;gap:10px;margin-bottom:var(--sp-2)}
.mini .micon{font-size:30px;filter:drop-shadow(0 4px 6px rgba(0,0,0,0.6));flex-shrink:0}
.mini .micon img.i3d{width:var(--ic-xl);height:var(--ic-xl)}
.mini .mtext{font-size:var(--fs-xs);color:var(--dim);line-height:1.45}
.shout{background:var(--black);border:1px solid var(--choc-4);border-radius:var(--r-s);padding:var(--sp-2);font-size:var(--fs-xs);color:var(--silver);font-style:italic;line-height:1.4}
/* 3D map stage */
.map-stage{position:relative;width:100%;aspect-ratio:1/1.02;max-height:62vh;border-radius:var(--r-l);overflow:hidden;border:2px solid var(--bronze);box-shadow:0 6px 0 var(--ink),0 12px 24px rgba(0,0,0,0.6);background:linear-gradient(180deg,#78c8f5,#d9f2ff);touch-action:manipulation}
.map-stage canvas{display:block;width:100%;height:100%}
#mapLabels{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;transition:opacity 0.2s}
.map-label{position:absolute;left:0;top:0;pointer-events:auto;min-height:36px;min-width:44px;justify-content:center;padding:4px 8px;font-size:15px;border-radius:16px;background:rgba(255,255,255,0.92);color:var(--on-light);font-weight:900;letter-spacing:0.3px;text-transform:uppercase;white-space:nowrap;box-shadow:0 3px 0 rgba(42,26,18,0.35);display:flex;align-items:center;gap:5px}
/* count badge: #2A1A12 on #ff9f1c = 8.15:1 (white was 2.05:1) */
.map-label b{background:#ff9f1c;color:var(--on-light);border-radius:10px;padding:1px 6px;font-size:var(--fs-2xs);font-variant-numeric:tabular-nums}
.map-label.sel{background:#ffd43b}
.map-label::after{content:'';position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);border:5px solid transparent;border-top-color:rgba(255,255,255,0.92);border-bottom:0}
/* focus on the light sky: dark ring #2A1A12 = 14.4:1 on #d9f2ff (bronze-lt was 1.76:1) */
.map-label:focus-visible,.map-back:focus-visible,.map-title-pill:focus-visible{outline:3px solid var(--on-light);outline-offset:2px}
#mapFade{position:absolute;top:0;right:0;bottom:0;left:0;background:#fff8e7;opacity:0;pointer-events:none;transition:opacity 0.22s}
#mapFade.on{opacity:1}
#mapBadge{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;align-items:center;gap:var(--sp-2);pointer-events:none}
.map-back,.map-title-pill{pointer-events:auto;min-height:var(--tap);padding:0 14px;border-radius:var(--r-pill);background:rgba(255,255,255,0.94);color:var(--on-light);font-size:var(--fs-2xs);font-weight:900;text-transform:uppercase;letter-spacing:0.5px;box-shadow:0 3px 0 rgba(42,26,18,0.35);display:inline-flex;align-items:center;gap:4px;min-width:0}
.map-title-pill{background:#ffd43b;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.map-title-pill img.i3d{width:var(--ic-s);height:var(--ic-s)}

/* ---------- TOGGLES ---------- */
.toggle-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:var(--sp-2) 0;border-bottom:1px solid var(--choc-3)}
.toggle-row:last-child{border-bottom:0}
.toggle-label{font-size:var(--fs-s);font-weight:700;color:var(--text)}
.toggle-sub{font-size:var(--fs-2xs);color:var(--dim-2);margin-top:2px;line-height:1.4}
.sw{width:58px;height:var(--tap);position:relative;flex-shrink:0}
/* OFF track edge uses --dim-2: 4.87:1 on the card (was 1.20:1) */
.sw::before{content:'';position:absolute;left:6px;top:9px;width:46px;height:26px;border-radius:14px;background:var(--choc);border:1.5px solid var(--dim-2);transition:all 0.2s}
.sw::after{content:'';position:absolute;top:13px;left:10px;width:18px;height:18px;border-radius:50%;background:var(--dim);transition:all 0.2s}
.sw[aria-checked="true"]::before{background:var(--bronze);border-color:var(--bronze-lt)}
.sw[aria-checked="true"]::after{transform:translateX(20px);background:var(--black)}

/* ---------- VOTES ---------- */
.vote-row{display:flex;align-items:center;gap:var(--sp-2);margin-top:var(--sp-2);flex-wrap:wrap}
.vote-btn{display:inline-flex;align-items:center;gap:4px;min-height:var(--tap);min-width:52px;justify-content:center;padding:0 12px;background:var(--choc);border:1px solid var(--choc-4);border-radius:10px;font-size:var(--fs-xs);font-weight:800;color:var(--dim);transition:all 0.15s;font-variant-numeric:tabular-nums}
.vote-btn.up{color:var(--green);border-color:rgba(46,204,113,0.5)}
.vote-btn.down{color:var(--red-txt);border-color:rgba(231,76,60,0.5)}
.vote-btn.up.active{background:rgba(46,204,113,0.18);border-color:var(--green)}
.vote-btn.down.active{background:rgba(231,76,60,0.18);border-color:var(--red)}

/* ---------- CANVAS ---------- */
.canvas-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-2)}
.canvas-cell{background:var(--choc-2);border:1.5px solid var(--bronze-dk);border-radius:10px;padding:var(--sp-3);aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:var(--sh-sm);overflow:hidden;position:relative}
.canvas-cell.photo{padding:0}
.canvas-cell.photo img{width:100%;height:100%;object-fit:cover}
.canvas-cell .cap{position:absolute;bottom:0;left:0;right:0;background:rgba(11,10,14,0.78);font-size:var(--fs-2xs);color:var(--bronze-lt);padding:5px;font-weight:800;text-transform:uppercase}
.canvas-cell .cem{font-size:34px;margin-bottom:6px}
.canvas-cell .chandle{font-size:var(--fs-2xs);color:var(--bronze-lt);font-weight:800;text-transform:uppercase;letter-spacing:0.4px}
.canvas-cell .cdesc{font-size:var(--fs-2xs);color:var(--dim);margin-top:3px;line-height:1.3}
input[type=file].vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* ---------- PLAN DAY ----------
   Slots are short cards (not squares) so the options list starts above the fold (DES-14). */
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:var(--sp-3)}
.slots.spin{animation:spin 1.2s ease-in-out}
@keyframes spin{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
.slot{min-height:92px;max-width:100%;min-width:0;background:var(--choc);border:2px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px;text-align:center;transition:all 0.25s;color:inherit;overflow:hidden}
.slot.filled{background:linear-gradient(160deg,var(--choc-4),var(--choc-2));border-style:solid;border-color:var(--bronze);box-shadow:inset 0 3px 0 rgba(0,0,0,0.4),0 3px 0 var(--bronze-dk)}
.slot .si{font-size:24px;margin-bottom:3px;line-height:1}
.slot .si img.i3d{width:var(--ic-l);height:var(--ic-l)}
.slot .sn{font-size:var(--fs-2xs);font-weight:800;color:var(--bronze-lt);line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:100%;-webkit-hyphens:auto;hyphens:auto}
.slot .smeta{font-size:var(--fs-2xs);color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
@media (min-width:420px){.slot{min-height:100px}}
.plan-opt{width:100%;min-height:var(--tap);padding:var(--sp-2) 11px;background:var(--choc-3);border:1.5px solid var(--choc-4);border-radius:10px;font-size:var(--fs-s);font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:var(--sp-2);transition:all 0.15s;text-align:left;color:inherit}
.plan-opt>span:first-child{min-width:0}
.plan-opt>.pill{flex-shrink:0;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block}
.plan-opt:disabled{opacity:0.4}
.plan-opt.mine{border-color:var(--bronze-dk)}

/* ---------- FLASHBACK ---------- */
.flash-frame{aspect-ratio:16/10;max-width:100%;border-radius:var(--r-m);background:linear-gradient(160deg,#2A1A12,var(--black));border:1.5px solid var(--bronze);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;margin-bottom:10px;box-shadow:var(--sh-sm)}
.flash-frame::after{content:'';position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,0.8))}
.flash-frame .era{position:absolute;bottom:10px;left:12px;font-size:var(--fs-2xs);color:var(--bronze-lt);font-weight:900;letter-spacing:2px;text-transform:uppercase;z-index:2}
.flash-frame .pos{position:absolute;bottom:10px;right:12px;font-size:var(--fs-2xs);color:var(--dim);font-weight:800;z-index:2;font-variant-numeric:tabular-nums}
.flash-nav{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2);margin-bottom:10px}
.flash-nav .btn{margin-top:0}
.range{width:100%;accent-color:var(--bronze);min-height:var(--tap)}

/* ---------- SETTINGS SHEET ---------- */
.sheet-bg{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,0.6);z-index:150}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:85%;overflow-y:auto;overscroll-behavior:contain;background:linear-gradient(180deg,var(--choc-2),var(--black));border-top:2px solid var(--bronze);border-radius:var(--r-l) var(--r-l) 0 0;z-index:151;padding:var(--sp-4) var(--gut-r) calc(var(--sp-4) + env(safe-area-inset-bottom,0px)) var(--gut-l)}
.sheet h2{font-size:var(--fs-m);letter-spacing:2px;text-transform:uppercase;color:var(--bronze-lt);margin-bottom:10px}

/* ---------- RESPONSIVE ---------- */
/* Short phones (568-640px tall, or browser chrome eating the viewport): tighter card art, smaller actions. */
@media (max-height:700px){
  .ev-art{font-size:64px;min-height:72px}
  .ev-body{padding:10px 12px 12px}
  .ev-name{font-size:var(--fs-m)}
  .ev-meta{margin-bottom:6px}
  .act{width:54px;height:54px;font-size:21px}
  .act.maybe{width:46px;height:46px;font-size:18px}
  .actions{gap:var(--sp-5)}
  #filterRow{margin-bottom:10px}
  #filterRow .tile{min-height:46px;padding:4px 0}
  #filterRow .tile-ic{width:20px;height:20px}
  .deck{min-height:180px;margin-bottom:14px}
  .map-stage{max-height:46vh}
  #hoodChips .tile{min-height:48px;padding:4px 0}
  .map-head{margin-bottom:6px}
  .badge{top:10px;padding:5px 10px;font-size:var(--fs-xs)}
}
/* Landscape phones: chrome compacts, and Swipe goes two-column (deck left, controls right). */
@media (max-height:500px) and (min-aspect-ratio:1/1){
  .topbar{padding-top:max(4px,env(safe-area-inset-top,0px));padding-bottom:4px}
  .dock{padding-top:4px;padding-bottom:calc(4px + env(safe-area-inset-bottom,0px))}
  .dock-btn{min-height:var(--tap);flex-direction:row;gap:6px;padding:4px}
  .dock-btn .icon{height:22px}
  #swipe{display:grid;grid-template-columns:minmax(0,1fr) 186px;grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"deck head" "deck filters" "deck actions";column-gap:var(--sp-3);padding-top:var(--sp-2);padding-bottom:var(--sp-2)}
  .swipe-head{grid-area:head;flex-direction:column;align-items:flex-start;gap:2px;margin-bottom:6px}
  .swipe-count{text-align:left}
  #filterRow{grid-area:filters;--cols:3;margin-bottom:var(--sp-2)}
  #filterRow .tile{min-height:var(--tap)}
  .deck{grid-area:deck;min-height:0;margin-bottom:6px}
  .actions{grid-area:actions;align-self:end;gap:var(--sp-3)}
  .ev-art{font-size:48px;min-height:48px}
  .ev-body{padding:8px 10px 10px}
  .ev-name{font-size:var(--fs-s)}
  .ev-meta{font-size:var(--fs-2xs);margin-bottom:4px}
}
/* Desktop browsers / website: the phone column becomes a framed device-like panel on a warm backdrop. */
@media (min-width:640px) and (min-height:720px){
  body{background:radial-gradient(ellipse at 50% 0%,#2A1A12 0%,var(--black) 65%) fixed}
  #app{height:calc(100% - 48px);margin:24px auto;border:1.5px solid var(--bronze-dk);border-radius:28px;box-shadow:0 0 0 6px rgba(21,10,5,0.9),0 30px 80px rgba(0,0,0,0.7),0 0 120px rgba(205,127,50,0.12)}
  .toast{bottom:calc(120px + env(safe-area-inset-bottom,0px))}
}
/* keep keyboard-focused content clear of the sticky section bar */
#feeds,#life{scroll-padding-top:56px}
/* 200% zoom / very narrow: icon-only dock (labels stay in aria-label) (DES-7) */
@media (max-width:300px){
  .dock-btn>span:last-child{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .dock-btn{margin:0 2px}
  .dock-btn .icon img.i3d{width:var(--ic-m);height:var(--ic-m)}
  .tiles{--tgap:4px}
  #feedTabs,#lifeTabs,#hoodChips{--cols:3}
  #filterRow{--cols:3}
}
/* Touch + on-screen keyboard: give the focused field the room the dock was using (MOB-10). */
@media (hover:none) and (pointer:coarse){
  body:has(.screen input:not([type=range]):not([type=file]):focus) .dock,
  body:has(.screen textarea:focus) .dock{display:none}
}

/* ---------- OLDER ENGINES (MOB-5) ---------- */
/* no aspect-ratio (iOS < 15, Chrome < 88): give the boxes real heights */
@supports not (aspect-ratio:1/1){
  .map-stage{height:92vw;max-height:62vh}
  .canvas-cell{height:42vw;max-height:200px}
  .flash-frame{height:56vw;max-height:268px}
}
/* no flex gap (iOS < 14.5): inset support is the closest detectable proxy */
@supports not (inset:0){
  .tiles{margin:0}
  .tiles>.tile{margin:3px;flex-basis:calc(100% / var(--cols) - 6px);max-width:calc(100% / var(--cols) - 6px)}
  .row>*+*,.vote-row>*+*,.ev-tags>*+*{margin-left:6px}
  .actions>*+*{margin-left:var(--sp-4)}
}

/* ---------- MOTION ---------- */

  /* ---------- TILE ROWS (lane A: Swipe filters, Feeds/Life sections, Map hoods) ----------

     All options are visible at once in a wrapping icon-tile grid (no horizontal scrolling anywhere). */
  const TILE_ROWS={};
  function tileRow(id,items,cur,act,opt){
    opt=opt||{};
    const row=$(id);if(!row)return;
    let st=TILE_ROWS[id];
    if(!st||st.row!==row||!row.firstElementChild){
      const tabs=!!opt.tabs;
      row.innerHTML=items.map((t,i)=>`<button type="button" class="tile ${opt.cls||''}" id="${id}-${i}" data-act="${act}" data-arg="${esc(String(t.id))}"${tabs?` role="tab" aria-controls="${opt.panel}"`:''}${t.aria?` aria-label="${esc(t.aria)}"`:''}><span class="tile-ic" aria-hidden="true">${ic(t.ic)}</span><span class="tile-lb">${t.label}</span>${t.n!=null?`<span class="tile-n" aria-hidden="true">${t.n}</span>`:''}</button>`).join('');
      st=TILE_ROWS[id]={row,tabs,items,cur:undefined};
      if(tabs)row.addEventListener('keydown',e=>{
        const b=[...row.querySelectorAll('.tile')],i=b.indexOf(document.activeElement);if(i<0)return;
        const j={ArrowRight:i+1,ArrowLeft:i-1,Home:0,End:b.length-1}[e.key];
        if(j==null)return;e.preventDefault();const n=b[(j+b.length)%b.length];n.focus();n.click();
      });
      if(opt.mini)setupMini(opt.mini,row);
    }
    let idx=items.findIndex(t=>String(t.id)===String(cur));
    if(idx<0&&st.tabs)idx=0;
    if(st.cur===idx)return;
    st.cur=idx;
    row.querySelectorAll('.tile').forEach((b,i)=>{
      const on=i===idx;b.classList.toggle('active',on);
      if(st.tabs){b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1;}else b.setAttribute('aria-pressed',on);
    });
    if(st.tabs&&opt.panel&&idx>=0){const pn=$(opt.panel);if(pn)pn.setAttribute('aria-labelledby',`${id}-${idx}`);}
    if(opt.mini&&idx>=0){const m=$(opt.mini),t=items[idx];if(m&&m.firstElementChild)m.firstElementChild.innerHTML=`<span class="tile-ic" aria-hidden="true">${ic(t.ic)}</span><span class="mini-lb">${t.label}</span><span class="mini-more">Sections</span>`;}
  }
  /* Compact bar that appears once the tile grid has scrolled away; tap it to bring every section back. */

  /* ---------- SWIPE ---------- */
  const FILTERS=[{id:'All',ic:'✨',label:'All'},{id:'Music',ic:'🎵',label:'Music'},{id:'Food',ic:'🍽️',label:'Food'},{id:'Arts',ic:'🎨',label:'Arts'},{id:'Outdoors',ic:'🌳',label:'Outdoors'}];

    const decided=new Set(S.saved.map(s=>s.id));
    q.sort((a,b)=>(decided.has(a.id)-decided.has(b.id))||(scoreOf(b)-scoreOf(a))||(a.id-b.id));
    q.splice(Math.min(4,q.length),0,GOLDEN);

  function flyOut(card,type,dy){
    card.style.transition='transform 0.32s ease, opacity 0.32s';

    else if(type==='no')card.style.transform=`translate(-500px,${dy||-50}px) rotate(-30deg)`;
    else card.style.transform='translate(0,-600px)';
    card.style.opacity='0';
  }
  function finishSwipe(item,type){
    const gen=T.deckGen, hadFocus=!!document.activeElement&&document.activeElement.id==='deckTop';
    commitSwipe(item,type);
    setTimeout(()=>{
      T.busy=false;
      if(gen!==T.deckGen)return;          // deck was rebuilt (filter / reset) while this card flew out
      swipeIdx++;renderDeck();
      const next=QUEUE[swipeIdx], said={yes:'Saved',maybe:'Added to maybe',no:'Skipped'}[type]||'';
      announce(next?`${said}. Next: ${cardLabel(next)}`:`${said}. You're all caught up.`);
      if(hadFocus){const n=$('deckTop')||document.querySelector('#deck [data-act=resetDeck]');if(n)n.focus({preventScroll:true});}

  function attachDrag(card,item){
    let startX=0,startY=0,dx=0,dy=0,dragging=false,horiz=false;
    const bY=card.querySelector('.badge.yes'), bN=card.querySelector('.badge.no');
    const reset=()=>{card.style.transition='transform 0.3s';card.style.transform='';bY.style.opacity=0;bN.style.opacity=0;};
    card.addEventListener('pointerdown',e=>{
      if(T.busy)return;
      dragging=true;horiz=false;dx=dy=0;startX=e.clientX;startY=e.clientY;
      try{card.setPointerCapture(e.pointerId);}catch(err){}
      card.style.transition='none';
    });
    card.addEventListener('pointermove',e=>{
      if(!dragging)return;
      dx=e.clientX-startX;dy=e.clientY-startY;
      // MOB-7: only drag sideways once the intent is clear; vertical moves belong to the page scroll.
      if(!horiz){if(Math.abs(dx)<8&&Math.abs(dy)<8)return;if(Math.abs(dy)>Math.abs(dx)){dragging=false;reset();return;}horiz=true;}
      card.style.transform=`translate(${dx}px,${dy*0.15}px) rotate(${dx*0.08}deg)`;
      if(dx>30){bY.style.opacity=Math.min(1,(dx-30)/70);bN.style.opacity=0;}
      else if(dx<-30){bN.style.opacity=Math.min(1,(-dx-30)/70);bY.style.opacity=0;}
      else{bY.style.opacity=0;bN.style.opacity=0;}
    });
    const end=e=>{
      if(!dragging)return;dragging=false;
      if(e.type!=='pointercancel'&&horiz&&Math.abs(dx)>100&&!T.busy){
        T.busy=true;vibrate(25);
        const type=dx>0?'yes':'no';
        flyOut(card,type,dy*0.15);finishSwipe(item,type);
      } else reset();
    };
    card.addEventListener('pointerup',end);
    card.addEventListener('pointercancel',end);
  }
  function swipeAction(type){
    if(T.busy||swipeIdx>=QUEUE.length)return;
    const top=$('deck').lastElementChild;
    if(!top||!top.classList.contains('ev-card'))return;
    T.busy=true;vibrate(25);
    flyOut(top,type);finishSwipe(QUEUE[swipeIdx],type);
  }
  function commitSwipe(item,type){
    if(!item)return;

      if(type==='yes'&&!S.preorder){S.preorder=true;toast('Issue #1 reserved on this device');}
      save();updateCount();return;
    }
    const delta={yes:2,maybe:1,no:-1}[type]||0;
    item.tags.forEach(t=>S.tagScores[t]=(S.tagScores[t]||0)+delta);
    S.saved=S.saved.filter(s=>s.id!==item.id);
    if(type==='yes'){S.saved.push({id:item.id,type:'yes'});toast('Saved to My RVA');}
    else if(type==='maybe'){S.saved.push({id:item.id,type:'maybe'});toast('Added to Maybe');}
    save();updateCount();

          ${nextArrivals(r).map(s=>`<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--choc-3)"><span class="den">${esc(s.name)}</span><span class="pill ${s.min<=3?'gold':'green'}">${s.min<=1?'Now':s.min+' min'}</span></div>`).join('')}
        </div>`).join('')}
      <div class="card"><div class="card-label">Coming later · RVA Private Rides</div><div class="den">A local driver network, planned for a later phase.</div>
        <button type="button" class="btn sm${S.waitlist?' on':' ghost'} mt-2" data-act="waitlist" aria-pressed="${S.waitlist}">${S.waitlist?'✓ Interest noted':'I\'m interested'}</button></div>`;
  }
  function manageTransitTimer(){
    const need=S.screen==='life'&&S.lifeTab==='transit';
    if(need&&!T.transitTimer)T.transitTimer=setInterval(()=>{if(S.screen==='life'&&S.lifeTab==='transit')keepFocus(()=>put('lifeContent',renderTransit()));},20000);
    if(!need&&T.transitTimer){clearInterval(T.transitTimer);T.transitTimer=null;}
  }
  function renderPlan(){
    const filled=S.plan.filter(Boolean).length, complete=filled===4;
    const opts=planOptions();
    return `<div class="card"><div class="card-label">${ic('🧩')} Plan Your Day · ${filled}/4</div><div class="den">Tap an option to fill the next slot. Tap a filled slot to clear it. Your saved events are listed first.</div></div>
      <div class="slots" id="slots" role="group" aria-label="Day plan, ${filled} of 4 filled">
        ${S.plan.map((p,i)=>p?`<button type="button" class="slot filled" data-act="clearSlot" data-arg="${i}" aria-label="Clear slot ${i+1}: ${esc(p.name)}, ${esc(p.meta)}"><span class="si" aria-hidden="true">${ic(p.em)}</span><span class="sn">${esc(p.name)}</span><span class="smeta">${esc(p.meta)}</span></button>`
          :`<div class="slot"><span class="si" aria-hidden="true">+</span><span class="sn">Empty slot ${i+1}</span></div>`).join('')}
      </div>
      ${complete?`<div class="card gold"><div class="card-label">${ic('✅')} Route complete</div><div class="den t-bronze">${S.plan.map(p=>esc(p.name)).join(' → ')}</div><button type="button" class="btn" data-act="copyPlan">Copy route</button><textarea class="field" id="planText" readonly hidden aria-label="Your route"></textarea></div>`:''}
      <div class="card-label mt-2">Add to plan</div>
      ${opts.map((o,i)=>{const used=S.plan.some(p=>p&&p.name===o.name);return `<button type="button" class="plan-opt${o.mine?' mine':''}" data-act="fillSlot" data-arg="${i}" ${used||complete?'disabled':''}>
          <span>${ic(o.em)} ${esc(o.name)}${o.mine?' <span class="pill green">Saved</span>':''}</span><span class="pill dim">${esc(o.meta)}</span></button>`;}).join('')}`;
  }
  /* Returns 'complete' when this fills the last slot, true when added, false when refused (JS-11). */
  function addToPlan(o){
    if(S.plan.some(p=>p&&p.name===o.name)){toast('Already in your plan');return false;}
    const idx=S.plan.findIndex(p=>!p);
    if(idx===-1){toast('Plan is full. Clear a slot first.');return false;}
    S.plan[idx]={em:o.em,name:o.name,meta:o.meta};
    vibrate(25);save();
    if(S.plan.every(Boolean)){T.spinNext=true;toast('🎉 Route complete');return 'complete';}
    return true;
  }

  /* ---------- PHOTOS ---------- */
  function handlePhoto(input,kind){
    const file=input.files&&input.files[0];input.value='';
    if(!file)return;
    if(!/^image\//.test(file.type)){toast('Pick an image file');return;}
    if(file.size>15*1024*1024){toast('Image is over 15 MB');return;}
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=480, sc=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        const src=c.toDataURL('image/jpeg',0.72);
        const list=S.photos[kind], photo={src,day:new Date().toLocaleDateString('en-US',{timeZone:TZ,month:'short',day:'numeric'}),t:Date.now()};
        list.unshift(photo);
        if(list.length>6)list.length=6;
        const r=save();
        // JS-5: older photos stay saved; only what does not fit is kept for this session.
        toast(r==='ok'?'Photo added':r==='partial'?(T.unsavedPhotos.size===1&&T.unsavedPhotos.has(photo)?'Photo added for this session. Device storage is full.':`Device storage is full: ${T.unsavedPhotos.size} photo${T.unsavedPhotos.size>1?'s':''} kept for this session only`):'Photo added for this session only',3200);
        keepFocus(rerenderActive);
      };
      img.onerror=()=>toast('That image could not be read');
      img.src=reader.result;
    };
    reader.onerror=()=>toast('That file could not be read');
    reader.readAsDataURL(file);
  }

  /* ---------- SETTINGS (modal dialog: inert background, Tab wrap fallback, Escape, focus return; DES-8/JS-10) ---------- */
  const BG_SEL='.topbar,.screens,.dock';
  function storageLine(){
    return storeState==='ok'?'Everything you do is saved on this device only.'
      :storeState==='partial'?'Saved on this device, except some photos: device storage is full.'
      :'<span class="t-warn">Storage is blocked in this browser (private mode?). Nothing will be kept after you close this tab.</span>';
  }
  function openSettings(){
    T.resetArmed=false;
    if(!$('sheetRoot').firstElementChild)T.lastFocus=document.activeElement;
    put('sheetRoot',`<div class="sheet-bg" data-act="closeSettings"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setTitle">
        <h2 id="setTitle">Settings</h2>
        <div class="card">
          <div class="toggle-row"><div><div class="toggle-label" id="lbl_calm">Calm mode</div><div class="toggle-sub" id="sub_calm">Turns off floating clouds, spins and card animations</div></div><button type="button" class="sw" role="switch" aria-checked="${!!S.settings.calm}" aria-labelledby="lbl_calm" aria-describedby="sub_calm" data-act="setting" data-arg="calm"></button></div>
          <div class="toggle-row"><div><div class="toggle-label" id="lbl_hap">Haptics</div><div class="toggle-sub" id="sub_hap">Vibration on taps (Android; iOS browsers ignore it)</div></div><button type="button" class="sw" role="switch" aria-checked="${!!S.settings.haptics}" aria-labelledby="lbl_hap" aria-describedby="sub_hap" data-act="setting" data-arg="haptics"></button></div>
        </div>
        <div class="card">
          <div class="card-label">What's real in this build</div>
          <div class="den">Version ${esc(window.RVA_VERSION||'dev')} · build ${esc(window.RVA_BUILD||'local')}${window.RVA_THREE==='none'?' · 3D map unavailable (offline), using the 2D board':''}</div>
          <div class="den">Computed live: clock, sunrise/sunset, moon phase and sign. Real places: restaurants, venues, trails, history facts. Labeled <span class="pill sample">Sample</span>: events, posts, headcounts, alerts, ratings. Transit is a simulated schedule.</div>
          <div class="den mt-2" id="storeLine">${storageLine()}</div>
        </div>
        <button type="button" class="btn red" data-act="resetAll" id="resetBtn">Erase my data on this device</button>
        <button type="button" class="btn ghost" data-act="closeSettings">Done</button>
      </div>`);
    document.querySelectorAll(BG_SEL).forEach(n=>{n.setAttribute('inert','');n.setAttribute('aria-hidden','true');});
    const first=$('sheetRoot').querySelector('.sw');if(first)first.focus();
  }
  function closeSettings(){
    if(!$('sheetRoot').firstElementChild)return;
    $('sheetRoot').innerHTML='';
    document.querySelectorAll(BG_SEL).forEach(n=>{n.removeAttribute('inert');n.removeAttribute('aria-hidden');});
    const back=T.lastFocus&&document.contains(T.lastFocus)?T.lastFocus:document.querySelector('.topbar [data-act=openSettings]');
    T.lastFocus=null;if(back)back.focus({preventScroll:true});
  }
  const sheetOpen=()=>!!$('sheetRoot').firstElementChild;
  /* Tab wrap inside the dialog: needed where `inert` is not supported (Chrome < 102, Safari < 15.5). */
  function trapTab(e){
    const box=$('sheetRoot').querySelector('.sheet');if(!box)return;
    const f=[...box.querySelectorAll('button:not([disabled]),[href],input,textarea,select,[tabindex]:not([tabindex="-1"])')].filter(n=>n.offsetParent!==null);
    if(!f.length)return;
    const first=f[0],last=f[f.length-1],a=document.activeElement;
    if(!box.contains(a)){e.preventDefault();first.focus();}
    else if(e.shiftKey&&a===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&a===last){e.preventDefault();first.focus();}
  }
  function applySettings(){document.body.classList.toggle('calm',!!S.settings.calm);if(typeof W3!=='undefined'&&W3.ok){W3.kick();W3.sky.setActive(S.screen==='home');}}

  /* ---------- RERENDER + FOCUS (DES-3 / WCAG 2.4.3) ----------
     Renders replace innerHTML, which destroys the focused control. keepFocus() remembers the focused control's
     data-act/data-arg (or id) and moves focus to the equivalent control after the render. If that control is gone
     (a deleted post), focus goes to the nearest surviving panel so keyboard users never fall back to <body>. */
  function rerenderActive(){
    if(S.screen==='home')renderHome();
    else if(S.screen==='swipe')renderDeck();
    else if(S.screen==='map')renderMap();
    else if(S.screen==='feeds')renderFeeds();
    else if(S.screen==='life')renderLife();
  }
  function focusKey(n){
    if(!n||n===document.body)return null;
    const c=n.closest&&n.closest('[data-act]');
    if(c&&c.dataset.act)return {act:c.dataset.act,arg:c.dataset.arg,panel:c.closest('[role=tabpanel],.screen,#sheetRoot')};
    if(n.id)return {id:n.id,panel:n.closest('[role=tabpanel],.screen,#sheetRoot')};
    return null;
  }
  const shown=n=>n.offsetParent!==null||n.getClientRects().length>0;
  function findKey(k){
    if(k.id){const n=document.getElementById(k.id);return n&&shown(n)?n:null;}
    const base=`[data-act="${CSS.escape(k.act)}"]`;
    const same=[...document.querySelectorAll(base+(k.arg!=null?`[data-arg="${CSS.escape(k.arg)}"]`:':not([data-arg])'))].filter(shown);
    return same.find(n=>!n.disabled)||[...document.querySelectorAll(base)].filter(n=>shown(n)&&!n.disabled)[0]||null;
  }
  function restoreFocus(k){
    let n=findKey(k);
    if(!n&&k.panel&&k.panel.isConnected){n=k.panel;if(!n.hasAttribute('tabindex'))n.setAttribute('tabindex','-1');}
    if(n)n.focus({preventScroll:true});
  }
  /* Run a render; if it took focus away (focused node removed, or focus fell to <body>), put it back. */
  function keepFocus(fn){
    const a=document.activeElement;
    const k=a&&a!==document.body?focusKey(a):null;
    fn();
    const now=document.activeElement;
    if(k&&(!now||now===document.body||!now.isConnected))restoreFocus(k);
  }

  /* ---------- ACTIONS ---------- */
  function toggleVote(map,id,dir){
    const cur=map[id]||0;if(cur===dir)delete map[id];else map[id]=dir;vibrate();save();
  }
  function readText(id,min){
    const el=$(id);const v=(el&&el.value||'').trim();
    if(v.length<min){toast(min>1?`Write at least ${min} characters`:'Fill this in first');if(el)el.focus();return null;}
    return v;
  }
  const clearFields=(...ids)=>ids.forEach(id=>{const f=$(id);if(f)f.value='';});
  /* Radio groups (watch type, ratings): update checked state in place, no re-render. */
  function setRadio(btn){
    const g=btn.closest('[role=radiogroup]');if(!g)return;
    g.querySelectorAll('[role=radio]').forEach(r=>{const on=r===btn;r.setAttribute('aria-checked',on);r.tabIndex=on?0:-1;
      if(r.classList.contains('btn')){r.classList.toggle('on',on);r.classList.toggle('ghost',!on);}});
  }
  const ACT={
    go:a=>go(a),
    openSettings, closeSettings,
    setting:(a,t)=>{if(!(a in S.settings))return;S.settings[a]=!S.settings[a];save();applySettings();if(t)t.setAttribute('aria-checked',S.settings[a]);},
    resetAll:()=>{
      if(!T.resetArmed){T.resetArmed=true;const b=$('resetBtn');if(b)b.textContent='Tap again to erase everything';return;}
      try{if(store)store.removeItem(KEY);}catch(e){}
      Object.keys(DEFAULTS).forEach(k=>S[k]=clone(DEFAULTS[k]));
      T.lastFocus=null;applySettings();closeSettings();buildQueue();T.focusSector=null;go('home',true);toast('Data erased');
      const g=document.querySelector('.topbar [data-act=openSettings]');if(g)g.focus({preventScroll:true});
    },
    filter:a=>{S.filter=a;save();buildQueue();renderDeck();},
    swipe:a=>swipeAction(a),
    resetDeck:()=>{buildQueue();renderDeck();announce('Deck restarted. '+cardLabel(QUEUE[0]));},
    unsave:a=>{S.saved=S.saved.filter(s=>s.id!==Number(a));save();toast('Removed');rerenderActive();},
    planEvent:a=>{const e=EV(Number(a));if(!e)return;const r=addToPlan({em:e.art,name:e.name,meta:e.meta.split(' · ').slice(0,2).join(' · ')});if(r===true)toast('Added to Plan Day');rerenderActive();},
    preorder:()=>{S.preorder=!S.preorder;save();toast(S.preorder?'Issue #1 reserved on this device':'Reservation cancelled');renderHome();},
    sector:a=>tapSector(a), clearFocus, toggleSave:a=>toggleSave(a),
    feed:a=>{S.feedTab=a;save();renderFeeds();$('feeds').scrollTop=0;},
    life:a=>{S.lifeTab=a;save();renderLife();$('life').scrollTop=0;manageTransitTimer();},
    flash:a=>{T.flashIdx=(T.flashIdx+Number(a)+FLASH.length)%FLASH.length;vibrate();renderFeeds();},
    postBanter:()=>{const v=readText('banterText',3);if(!v)return;S.banterPosts.unshift({id:'u'+uid(),em:'🗣️',text:v,votes:0});save();clearFields('banterText');toast('Posted');renderFeeds();},
    delBanter:a=>{S.banterPosts=S.banterPosts.filter(p=>p.id!==a);delete S.banterUserVote[a];save();toast('Post deleted');renderFeeds();},
    banterVote:a=>{const [id,d]=a.split('|');toggleVote(S.banterUserVote,id,Number(d));renderFeeds();},
    handshake:a=>{S.handshakes[a]=!S.handshakes[a];if(!S.handshakes[a])delete S.handshakes[a];save();vibrate(20);toast(S.handshakes[a]?'Marked interested':'Removed');renderFeeds();},
    join:a=>{S.joins[a]=!S.joins[a];if(!S.joins[a])delete S.joins[a];save();vibrate(20);toast(S.joins[a]?"You're in":'You left the game');renderFeeds();},
    interest:a=>{S.interested[a]=!S.interested[a];if(!S.interested[a])delete S.interested[a];save();vibrate(20);renderFeeds();},
    clearPhotos:a=>{if(!S.photos[a])return;S.photos[a]=[];save();toast('Photos removed');rerenderActive();},
    watchType:(a,t)=>{T.watchType=Number(a)||0;if(t)setRadio(t);},
    postWatch:()=>{const v=readText('watchText',8);if(!v)return;const type=WATCH_TYPES[T.watchType]||WATCH_TYPES[0];S.watchPosts.unshift({id:'u'+uid(),type,text:v,votes:0,dist:'Near you'});save();clearFields('watchText');toast('Alert posted');renderLife();},
    delWatch:a=>{S.watchPosts=S.watchPosts.filter(p=>p.id!==a);delete S.watchUserVote[a];save();toast('Alert deleted');renderLife();},
    watchVote:a=>{const [id,d]=a.split('|');toggleVote(S.watchUserVote,id,Number(d));renderLife();},
    hallRate:a=>{const [i,n]=a.split('|').map(Number);if(!HALLOWEEN[i]||!(n>=1&&n<=10))return;S.hallRatings[i]=n;save();vibrate();renderLife();},
    hallClear:a=>{delete S.hallRatings[a];save();renderLife();},
    heart:a=>{S.dateHearts[a]=!S.dateHearts[a];if(!S.dateHearts[a])delete S.dateHearts[a];save();vibrate(20);renderLife();},
    postDate:()=>{const t=readText('dateTitle',3);if(!t)return;const v=readText('dateVibe',2);if(!v)return;const h=readText('dateHigh',2);if(!h)return;S.datePosts.unshift({id:'u'+uid(),em:'💌',title:t,vibe:v,highlight:h});save();clearFields('dateTitle','dateVibe','dateHigh');toast('Shared');renderLife();},
    delDate:a=>{S.datePosts=S.datePosts.filter(p=>p.id!==a);delete S.dateHearts[a];save();toast('Post deleted');renderLife();},
    toggleAccess:a=>{if(!(a in S.access))return;S.access[a]=!S.access[a];save();vibrate(20);renderLife();toast(S.access[a]?'Warning on':'Warning off');},
    waitlist:()=>{S.waitlist=!S.waitlist;save();renderLife();},
    fillSlot:a=>{const o=planOptions()[Number(a)];if(o)addToPlan(o);renderLife();},
    clearSlot:a=>{S.plan[Number(a)]=null;vibrate();save();renderLife();},
    copyPlan:()=>{
      const text='My RVA day: '+S.plan.filter(Boolean).map(p=>`${p.name} (${p.meta})`).join(' → ');
      const fallback=()=>{const ta=$('planText');if(ta){ta.hidden=false;ta.value=text;ta.focus();ta.select();}toast('Select the text to copy');};
      try{navigator.clipboard.writeText(text).then(()=>toast('Route copied'),fallback);}catch(e){fallback();}
    },
  };
  const CHANGE={
    count:(el,a)=>{const c=$(a);if(c)c.textContent=`${el.value.length} / ${el.maxLength}`;},
    photo:(el,a)=>{if(PHOTO_KINDS.includes(a))handlePhoto(el,a);},
  };

  /* ---------- WIRE UP ---------- */
  document.addEventListener('click',e=>{
    const t=e.target.closest('[data-act]');if(!t||t.disabled)return;
    const fn=ACT[t.dataset.act];if(!fn)return;
    keepFocus(()=>fn(t.dataset.arg,t,e));
  });
  document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.change==='count')CHANGE.count(t,t.dataset.arg);});
  document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.change&&t.dataset.change!=='count'){const f=CHANGE[t.dataset.change];if(f)keepFocus(()=>f(t,t.dataset.arg));}});
  document.addEventListener('keydown',e=>{
    if(sheetOpen()){
      if(e.key==='Escape'){e.preventDefault();closeSettings();}
      else if(e.key==='Tab')trapTab(e);
      return;
    }
    const a=document.activeElement;
    // Radio groups: arrows move + select (roving tabindex).
    if(a&&a.getAttribute&&a.getAttribute('role')==='radio'&&/^Arrow(Left|Right|Up|Down)$|^Home$|^End$/.test(e.key)){
      const rs=[...a.closest('[role=radiogroup]').querySelectorAll('[role=radio]')],i=rs.indexOf(a);
      const j={ArrowRight:i+1,ArrowDown:i+1,ArrowLeft:i-1,ArrowUp:i-1,Home:0,End:rs.length-1}[e.key];
      const n=rs[(j+rs.length)%rs.length];e.preventDefault();n.focus();n.click();return;
    }
    if(e.key==='Escape'&&S.screen==='map'&&T.focusSector!==null){clearFocus();return;}
    if(S.screen==='swipe'&&!/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&!(a.closest&&a.closest('.tiles'))){
      const k={ArrowRight:'yes',ArrowLeft:'no',ArrowUp:'maybe'}[e.key];
      if(k){e.preventDefault();swipeAction(k);}
    }
  });
  /* MOB-10: hide the dock while the on-screen keyboard is up (fallback for browsers without :has()). */
  document.addEventListener('focusin',e=>{const t=e.target;if(/^(INPUT|TEXTAREA)$/.test(t.tagName)&&!/range|file/.test(t.type||''))document.body.classList.add('kb');});
  document.addEventListener('focusout',()=>document.body.classList.remove('kb'));

  /* ---------- BOOT ----------
     icons.js (the next script) calls RVA_BOOT once the 3D icon table exists, so the first render already has its
     icons. If anything throws during boot, the saved state is copied to KEY-corrupt, the app restarts from defaults
     and says so, instead of leaving a blank screen on every reload (JS-3). */
  let booted=false;
  function setupSwipeA11y(){
    if($('deckHint'))return;
    const fine=!!(window.matchMedia&&matchMedia('(hover:hover) and (pointer:fine)').matches);
    const h=document.createElement('div');h.id='deckHint';
    h.className=fine?'den t-2xs t-center mt-1':'sr-only';
    h.textContent=fine?'Keys: → going · ← skip · ↑ maybe':'Use the buttons below the card: not for me, maybe, or going.';
    const acts=document.querySelector('#swipe .actions');if(acts)acts.insertAdjacentElement('afterend',h);
  }
  function startApp(){
    applySettings();
    setupSwipeA11y();
    buildQueue();
    go(S.screen,true);
  }
  function boot(){
    if(booted)return;booted=true;
    try{startApp();}
    catch(err){
      console.warn('RVA boot failed, starting fresh:',err);
      try{if(store){const raw=store.getItem(KEY);if(raw)store.setItem(KEY+'-corrupt',raw);store.removeItem(KEY);}}catch(e){}
      Object.keys(DEFAULTS).forEach(k=>S[k]=clone(DEFAULTS[k]));
      T.recovered=true;T.focusSector=null;
      startApp();
    }
    if(T.recovered)toast('Saved data could not be read, so the app started fresh. A backup copy was kept.',4500);
    else if(!store)storageNotice();
    setInterval(()=>{if(S.screen==='home')renderClock();},10000);
    try{if(store&&navigator.storage&&navigator.storage.persist&&window.matchMedia&&matchMedia('(display-mode: standalone)').matches)navigator.storage.persist();}catch(e){}
  }
  window.RVA_BOOT=boot;
  setTimeout(boot,0);   // fallback if the icon script is missing

  window.RVA_W3_OK=()=>W3.ok;window.RVA_W3_MODE=()=>W3.mode||'2d';
  window.RVA_W3_PROJECT=(x,y,z)=>{if(!W3.ok||!W3._ctl||!W3._ctl.city)return null;const c=W3._ctl.city,v=new THREE.Vector3(x,y,z).project(c.cam),st=document.getElementById('mapStage');return [(v.x+1)/2*st.clientWidth,(1-v.y)/2*st.clientHeight];};
  return {state:S, _test:{sunTimes,moonInfo,rvaParts,nextArrivals,TRANSIT,sanitize,T,storeState:()=>storeState,acts:Object.keys(ACT)}};
})();
</script>
<script type="text/rva" id="rva-icons">
/* ---------- 3D ICONS (rendered in Blender, see blender/props.py) ----------
   Templates emit <img class="i3d" data-i3d="id"> through ic() in core.js; fill() gives each one the shared data URI
   (no base64 is re-parsed per render). The MutationObserver is only a safety net for emoji that still arrive as
